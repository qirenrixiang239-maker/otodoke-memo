<!doctype html>
<!--
  お届け先メモ ― HTML(ページの骨組み)
  ここには「画面に何を置くか」だけを書いています。
  見た目は style.css、動きは app.js が担当します。
-->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>お届け先メモ</title>
  <!-- ホーム画面に追加したとき、アプリのように表示するための設定 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1d4fd8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="お届け先メモ">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <!-- 見た目のファイルを読み込む -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ▼ 画面の本体:タイトル・検索欄・お客さん一覧 -->
<div class="wrap">
  <header class="top">
    <h1>お届け先メモ<small>DELIVERY NOTES</small></h1>
    <div class="topright">
      <div class="stats" id="stats">読み込み中…</div>
      <!-- バックアップ画面を開くボタン -->
      <button class="menu" id="menu" aria-label="バックアップ">バックアップ</button>
      <!-- Excel 書き出し画面を開くボタン -->
      <button class="menu" id="xls-open">Excel</button>
    </div>
  </header>

  <!-- 検索欄と絞り込みボタン(スクロールしても上に固定される) -->
  <div class="searchbar">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" placeholder="名前・住所・番号で探す" autocomplete="off" aria-label="検索">
      <button class="clear" id="qclear" hidden>クリア</button>
    </div>
    <div class="chips" id="filters" role="group" aria-label="絞り込み"></div>
  </div>

  <div id="notice"></div>
  <!-- お客さんのカードがここに並ぶ(中身は app.js が作る) -->
  <main id="list"></main>
</div>

<!-- ▼ お客さんの詳細画面(名前を押すと開く)。普段は hidden で隠れている -->
<!-- 中身は app.js の detailHTML が作る -->
<div class="detail" id="detail" hidden role="dialog" aria-modal="true" aria-label="お客さんの詳細"></div>

<!-- ▼ 右下の「追加」ボタン -->
<button class="fab" id="add" aria-label="お届け先を追加">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>追加
</button>

<!-- ▼ 下から出てくる入力画面(追加・編集用)。普段は hidden で隠れている -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <form class="sheet-in" id="form" novalidate>
    <div class="grab"></div>
    <h3 id="sheet-title">お届け先を追加</h3>
    <div class="field"><label for="f-name">お客さんの名前</label><input id="f-name" required placeholder="例：田中" autocomplete="off"></div>
    <div class="field"><label for="f-addr">住所</label><input id="f-addr" placeholder="例：岩村田1234" autocomplete="off"></div>

    <!-- 建物の写真(1人1枚)。撮るか、アルバムから選ぶ -->
    <div class="field"><span class="lab">建物の写真</span>
      <div class="photo-edit">
        <div class="photo-box" id="f-photo-box"><span id="f-photo-empty">写真なし</span><img id="f-photo-img" alt="建物の写真" hidden></div>
        <div class="photo-btns">
          <label class="btn ghost filebtn" for="f-photo" id="f-photo-pick">写真を撮る・選ぶ</label>
          <button type="button" class="btn ghost" id="f-photo-del" hidden>写真を外す</button>
        </div>
        <input type="file" id="f-photo" accept="image/*" hidden>
      </div>
    </div>

    <!-- メーターの情報 -->
    <div class="group-title">メーター</div>
    <div class="field"><label for="f-maker">会社名</label><input id="f-maker" list="makers" placeholder="例：〇〇計器" autocomplete="off"></div>
    <!-- 一度入力した会社名は、次から候補に出る(中身は app.js が入れる) -->
    <datalist id="makers"></datalist>
    <div class="two">
      <div class="field"><label for="f-model">型式</label><input id="f-model" placeholder="例：NB4-X" autocomplete="off" autocapitalize="characters"></div>
      <!-- ピッチは 90 か 130 から選ぶ -->
      <div class="field"><label for="f-pitch">ピッチ</label>
        <select id="f-pitch"><option value="">未選択</option><option value="90">90</option><option value="130">130</option></select>
      </div>
    </div>
    <div class="two">
      <!-- 期限は「年と月」で入力する(スマホでは年月を選ぶ画面が出る) -->
      <div class="field"><label for="f-meterexp">期限</label><input id="f-meterexp" type="month" placeholder="例：2031-03" autocomplete="off"></div>
    </div>

    <!-- 調整器の情報 -->
    <div class="group-title">調整器</div>
    <div class="field"><label for="f-regmaker">会社名</label><input id="f-regmaker" list="regmakers" placeholder="例：〇〇製作所" autocomplete="off"></div>
    <datalist id="regmakers"></datalist>
    <div class="two">
      <div class="field"><label for="f-regmodel">型式</label><input id="f-regmodel" placeholder="例：R-10K" autocomplete="off" autocapitalize="characters"></div>
      <!-- 型は N型 か F型 から選ぶ -->
      <div class="field"><label for="f-regtype">型</label>
        <select id="f-regtype"><option value="">未選択</option><option value="N型">N型</option><option value="F型">F型</option></select>
      </div>
    </div>
    <div class="two">
      <div class="field"><label for="f-regexp">期限</label><input id="f-regexp" type="month" placeholder="例：2030-08" autocomplete="off"></div>
    </div>

    <!-- ボンベの情報 -->
    <div class="group-title">ボンベ</div>
    <div class="field"><label for="f-cyl">ボンベの番号</label><input id="f-cyl" placeholder="例：A-12345" autocomplete="off" autocapitalize="characters"></div>
    <div class="two">
      <!-- 容量は 10kg・20kg・50kg から選ぶ -->
      <div class="field"><label for="f-cap">容量</label>
        <select id="f-cap"><option value="">未選択</option><option value="10kg">10kg</option><option value="20kg">20kg</option><option value="50kg">50kg</option></select>
      </div>
      <!-- 本数は 1〜4本 から選ぶ -->
      <div class="field"><label for="f-cylcount">本数</label>
        <select id="f-cylcount"><option value="">未選択</option><option value="1本">1本</option><option value="2本">2本</option><option value="3本">3本</option><option value="4本">4本</option></select>
      </div>
    </div>

    <div class="err" id="f-err" hidden></div>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="f-cancel">閉じる</button>
      <button type="submit" class="btn primary" id="f-save">保存する</button>
    </div>
    <div class="sheet-actions" id="f-delwrap" hidden>
      <button type="button" class="btn danger" id="f-del">このお届け先を削除</button>
    </div>
  </form>
</div>

<!-- ▼ バックアップ画面(書き出し・読み込み)。普段は hidden で隠れている -->
<div class="sheet" id="backup" hidden role="dialog" aria-modal="true" aria-labelledby="backup-title">
  <div class="sheet-in">
    <div class="grab"></div>
    <h3 id="backup-title">バックアップ</h3>
    <p class="b-text" id="b-info"></p>
    <p class="b-text">データはこの端末の中だけにあります。端末の故障や機種変更に備えて、ときどき書き出したファイルを保存しておいてください。別の端末に移すときも、このファイルを使います。</p>
    <button type="button" class="btn primary" id="b-export">データを書き出す</button>
    <label class="btn ghost filebtn" for="b-import">書き出したファイルを読み込む</label>
    <input type="file" id="b-import" accept=".json,application/json" hidden>
    <p class="b-text small">読み込むと、この端末のデータはファイルの内容に置き換わります。</p>
    <div class="err" id="b-err" hidden></div>
    <button type="button" class="btn ghost" id="b-close">閉じる</button>
  </div>
</div>

<!-- ▼ Excel 書き出し画面。普段は hidden で隠れている -->
<div class="sheet" id="xls" hidden role="dialog" aria-modal="true" aria-labelledby="xls-title">
  <div class="sheet-in">
    <div class="grab"></div>
    <h3 id="xls-title">Excel で書き出す</h3>
    <div class="field">
      <span class="lab">載せるお客さん</span>
      <div class="opts">
        <label class="opt"><input type="radio" name="x-target" id="x-all" value="all" checked> 全員（<span id="x-all-n">0</span>人）</label>
        <label class="opt"><input type="radio" name="x-target" id="x-shown" value="shown"> 今の一覧に出ている人（<span id="x-shown-n">0</span>人）</label>
      </div>
    </div>
    <div class="field">
      <span class="lab">載せる項目</span>
      <!-- 項目のボタンは app.js が作る -->
      <div id="x-fields" class="x-fields"></div>
      <div class="x-quick">
        <button type="button" class="chip" id="x-all-fields">すべて選ぶ</button>
        <button type="button" class="chip" id="x-min-fields">名前だけにする</button>
      </div>
    </div>
    <p class="b-text" id="x-hint"></p>
    <div class="err" id="x-err" hidden></div>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="x-close">閉じる</button>
      <button type="button" class="btn primary" id="x-make">Excel ファイルを作る</button>
    </div>
  </div>
</div>

<!-- ▼ ボンベ交換の記録画面(詳細画面の「交換を記録」から開く)。普段は hidden で隠れている -->
<div class="sheet" id="exch" hidden role="dialog" aria-modal="true" aria-labelledby="exch-title">
  <form class="sheet-in" id="exch-form" novalidate>
    <div class="grab"></div>
    <h3 id="exch-title">ボンベ交換を記録</h3>
    <p class="b-text" id="e-who"></p>
    <div class="two">
      <div class="field"><label for="e-date">交換した日</label><input id="e-date" type="date"></div>
    </div>
    <div class="field"><label for="e-in">入り(回収した古いボンベ)の番号</label><input id="e-in" placeholder="例：C-20481" autocomplete="off" autocapitalize="characters"></div>
    <div class="field"><label for="e-out">出(設置した新しいボンベ)の番号</label><input id="e-out" placeholder="例：C-31507" autocomplete="off" autocapitalize="characters"></div>
    <p class="b-text small" id="e-note">一番新しい交換として記録すると、このお客さんの「ボンベの番号」が出の番号に変わり、前回配達日がこの日になります。</p>
    <div class="err" id="e-err" hidden></div>
    <div class="sheet-actions">
      <button type="button" class="btn ghost" id="e-cancel">閉じる</button>
      <button type="submit" class="btn primary" id="e-save">記録する</button>
    </div>
    <div class="sheet-actions" id="e-delwrap" hidden>
      <button type="button" class="btn danger" id="e-del">この記録を削除</button>
    </div>
  </form>
</div>

<!-- ▼ 写真を画面いっぱいに表示する。押すと閉じる -->
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="建物の写真"><img id="viewer-img" alt="建物の写真"><span class="viewer-hint">タップで閉じる</span></div>

<!-- ▼ 画面下に一瞬出るお知らせ(「元に戻す」ボタン付き) -->
<div class="toast" id="toast" hidden role="status"><span id="toast-msg"></span><button id="toast-undo">元に戻す</button></div>

<!-- 動きのファイルを最後に読み込む(画面の部品が全部そろってから動かすため) -->
<script src="app.js"></script>
</body>
</html>
